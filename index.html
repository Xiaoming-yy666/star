<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小冥的星空 - 许愿</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: 
                radial-gradient(circle at 80% 10%, rgba(40, 40, 60, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(20, 20, 35, 0.5) 0%, transparent 60%),
                #000000;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas { display: block; }

        /* 许愿框容器 */
        #wish-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            transition: opacity 1s;
        }
        
        /* 专属祝福文字：极简无边框，仅文字发光 */
        .wish-title {
            margin-bottom: 15px; /* 距离下方输入框的间距 */
            font-size: 16px; /* 字号调小了一点点 */
            color: #ffffff;
            letter-spacing: 3px;
            /* 纯文字发光动画 */
            animation: textGlow 3s infinite alternate ease-in-out;
        }

        @keyframes textGlow {
            0% { text-shadow: 0 0 6px rgba(255, 255, 255, 0.3); }
            100% { text-shadow: 0 0 18px rgba(255, 255, 255, 0.8), 0 0 8px rgba(255, 255, 255, 0.5); }
        }

        /* 输入框 */
        #wish-input {
            width: 260px;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            backdrop-filter: blur(5px);
            animation: inputGlow 3s infinite alternate ease-in-out;
        }
        #wish-input::placeholder { color: rgba(255, 255, 255, 0.3); letter-spacing: 1px; }
        
        @keyframes inputGlow {
            0% { 
                box-shadow: 0 0 5px rgba(255, 255, 255, 0.1); 
                border-color: rgba(255, 255, 255, 0.2); 
            }
            100% { 
                box-shadow: 0 0 25px rgba(255, 255, 255, 0.4); 
                border-color: rgba(255, 255, 255, 0.8); 
            }
        }

        /* 灰色许愿按钮 */
        #wish-btn {
            margin-top: 15px;
            padding: 10px 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }
        #wish-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* 许愿弹出的文字动画 */
        .wish-text {
            position: absolute;
            color: #fff;
            pointer-events: none;
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.4);
            animation: floatUp 4.5s ease-in-out forwards;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            z-index: 10;
        }
        
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, -30%) scale(0.9); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
            75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -90%) scale(1.02); }
        }
    </style>
</head>
